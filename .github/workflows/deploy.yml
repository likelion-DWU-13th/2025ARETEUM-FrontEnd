name: Deploy Frontend (fix/reset-main → production)

on:
  push:
    branches: [ fix/reset-main ]

jobs:
  deploy-prod-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH build & deploy on EC2 (prod)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            echo "== 1) 운영 프론트 소스 갱신 =="
            cd /srv/festival-frontend/areteum_fe
            git fetch --all --prune
            git reset --hard origin/main

            echo "== 2) Node 20 준비 (nvm) =="
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm install 20
            nvm use 20

            echo "== 3) 의존성 & 빌드 =="
            npm ci || npm install
            # CRA 경고 때문에 막히면 ↓ 한 줄로 교체
            # CI= npm run build
            npm run build

            echo "== 4) 산출물 동기화 -> prod 정적 폴더 =="
            rsync -av --delete build/ /srv/2025ARETEUM-Production-Deployment/frontend/

            echo "== 5) 운영 nginx(areteum-nginx) 설정 테스트 & 리로드 =="
            if ! docker ps --format '{{.Names}}' | grep -qx 'areteum-nginx'; then
              if docker ps -a --format '{{.Names}}' | grep -qx 'areteum-nginx'; then
                docker start areteum-nginx
              else
                echo "ERROR: areteum-nginx 컨테이너가 없습니다."; exit 1
              fi
            fi

            docker exec areteum-nginx nginx -t
            docker exec areteum-nginx nginx -s reload || docker restart areteum-nginx

            echo "== 6) 상태 확인 =="
            docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'areteum-nginx|areteum-prod-backend' || true
