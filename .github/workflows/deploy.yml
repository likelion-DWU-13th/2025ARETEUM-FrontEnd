name: Deploy Frontend (fix/reset-main → production)

on:
  push:
    branches: [ fix/reset-main ]

jobs:
  deploy-prod-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH build & deploy on EC2 (prod)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            echo "== 0) 경로/변수 =="
            APP_DIR="/srv/2025ARETEUM-FrontEnd/areteum_fe"
            DEPLOY_DIR="/srv/2025ARETEUM-Production-Deployment/frontend"
            BRANCH="fix/reset-main"
            echo "== 1) 프론트 소스 갱신 (${BRANCH}) =="
            cd "$APP_DIR"
              if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                 echo "ERROR: $APP_DIR 는 git 워킹트리가 아닙니다."
              exit 1
            fi
            cd "$APP_DIR"
            git fetch --all --prune
            # worktree로 이미 체크아웃된 브랜치이므로 강제 동기화
            git reset --hard "origin/${BRANCH}"
            git rev-parse --short HEAD
            echo "== 2) Node 준비 (nvm, Node 20) =="
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm install 20
            nvm use 20
            echo "== 3) 의존성 설치 & 빌드 =="
            if [ -f package-lock.json ]; then
              npm ci || npm install
            else
              npm install
            fi
            # CRA 기준(산출물: build/)
            npm run build
            echo "== 4) 산출물 동기화 → ${DEPLOY_DIR} =="
            rsync -av --delete build/ "${DEPLOY_DIR}/"
            echo "== 5) nginx 설정 점검 & 리로드 (prod 컨테이너) =="
            # 컨테이너 실행 보장
            if ! docker ps --format '{{.Names}}' | grep -qx 'areteum-prod-nginx'; then
              if docker ps -a --format '{{.Names}}' | grep -qx 'areteum-prod-nginx'; then
                docker start areteum-prod-nginx
              else
                echo "ERROR: areteum-prod-nginx 컨테이너가 없습니다."
                exit 1
              fi
            fi
            docker exec areteum-prod-nginx nginx -t
            docker exec areteum-prod-nginx nginx -s reload || docker restart areteum-prod-nginx
            echo "== 6) 상태 확인 =="
            docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'areteum-prod-nginx|areteum-prod-backend' || true
