name: Deploy Frontend (develop & fix/reset-main)

on:
  push:
    branches: [ "develop", "fix/reset-main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build

      - name: Ensure target dir on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /srv/2025ARETEUM-Production-Deployment/frontend

      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/*"           # Vite면 dist/* 로 바꾸기
          target: "/srv/2025ARETEUM-Production-Deployment/frontend/"
          strip_components: 1
          overwrite: true

      - name: Reload Nginx (in container)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/2025ARETEUM-Production-Deployment
            docker-compose exec -T nginx nginx -t
            docker-compose exec -T nginx nginx -s reload || docker-compose restart nginx
