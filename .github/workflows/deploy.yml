name: Deploy Frontend (fix/reset-main → production)

on:
  push:
    branches: [ fix/reset-main ]

jobs:
  deploy-prod-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH build & deploy on EC2 (prod)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            echo "== 1) 운영 프론트 소스 갱신 =="
            cd /srv/festival-frontend
            test -d areteum_fe || { echo "areteum_fe not found"; exit 1; }
            cd areteum_fe
            git fetch --all --prune
            git reset --hard origin/main

            echo "== 2) Node 20 준비 (nvm) =="
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm install 20
            nvm use 20

            echo "== 3) 의존성 & 빌드 =="
            npm ci || npm install
            # 경고로 빌드가 막히지 않도록 필요시 CI= 해제 (원하면 다음 줄 주석 해제)
            # CI= npm run build
            npm run build

            echo "== 4) 산출물 동기화 -> prod 정적 폴더 =="
            rsync -av --delete build/ /srv/2025ARETEUM-Production-Deployment/frontend/

            echo "== 5) 운영 nginx(areteum-nginx) 설정 테스트 & 리로드 =="
            # 컨테이너 있으면 기동 보장
            if ! docker ps --format '{{.Names}}' | grep -qx 'areteum-nginx'; then
              if docker ps -a --format '{{.Names}}' | grep -qx 'areteum-nginx'; then
                docker start areteum-nginx
              else
                echo "ERROR: areteum-nginx 컨테이너가 없습니다. 현재 운영은 areteum-nginx 기준입니다."
                echo "       필요 시 기존 컨테이너를 유지하고 리로드 대상만 areteum-nginx로 고정하세요."
                exit 1
              fi
            fi

            # 설정 문법 체크
            docker exec -T areteum-nginx nginx -t

            # 리로드 (실패시 재시작)
            docker exec -T areteum-nginx nginx -s reload || docker restart areteum-nginx

            echo "== 6) 상태 확인 =="
            docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'areteum-nginx|areteum-prod-backend' || true
